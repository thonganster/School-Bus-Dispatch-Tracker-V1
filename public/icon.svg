<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Bus body shadow -->
  <rect x="96" y="106" width="320" height="290" rx="42" fill="#000000" opacity="0.4" />

  <!-- Main School Bus Body -->
  <rect x="96" y="96" width="320" height="280" rx="40" fill="url(#busGrad)" stroke="#d97706" stroke-width="6" />

  <!-- Roof top lines -->
  <rect x="146" y="112" width="220" height="10" rx="5" fill="#d97706" opacity="0.6" />

  <!-- Windshield -->
  <rect x="126" y="136" width="260" height="96" rx="18" fill="#0f172a" />
  <rect x="136" y="146" width="116" height="76" rx="10" fill="#38bdf8" opacity="0.9" />
  <rect x="260" y="146" width="116" height="76" rx="10" fill="#38bdf8" opacity="0.9" />

  <!-- Bus Grill / Stripes -->
  <rect x="126" y="254" width="260" height="12" rx="6" fill="#1e293b" />
  <rect x="126" y="278" width="260" height="12" rx="6" fill="#1e293b" />

  <!-- Headlights -->
  <circle cx="146" cy="326" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
  <circle cx="146" cy="326" r="14" fill="#fef08a" />

  <circle cx="366" cy="326" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
  <circle cx="366" cy="326" r="14" fill="#fef08a" />

  <!-- Bumper -->
  <rect x="110" y="356" width="292" height="30" rx="15" fill="#334155" stroke="#1e293b" stroke-width="4" />

  <!-- Wheels -->
  <rect x="126" y="380" width="56" height="34" rx="12" fill="#0f172a" />
  <rect x="330" y="380" width="56" height="34" rx="12" fill="#0f172a" />

  <!-- Sign text / Bus Number -->
  <rect x="206" y="310" width="100" height="32" rx="8" fill="#0f172a" />
  <text x="256" y="332" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="1">BUS 50</text>
</svg>
